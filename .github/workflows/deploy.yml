name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 to match the VPS exactly — it has no TS type-stripping,
      # so everything must be compiled here.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck & build
        run: npm run typecheck

      # Reinstall without dev dependencies so the shipped bundle stays small.
      # The VPS never runs npm: it has 1.9 GB shared with another bot.
      - name: Prune to production dependencies
        run: npm ci --omit=dev

      - name: Package
        run: |
          tar czf aion.tar.gz \
            node_modules \
            package.json package-lock.json \
            apps/bot/dist apps/bot/package.json apps/bot/assets \
            packages/db/dist packages/db/package.json packages/db/migrations \
            deploy
          ls -lh aion.tar.gz

      - name: Upload artifact
        uses: actions/upload-artifact@v4
        with:
          name: aion-bundle
          path: aion.tar.gz
          retention-days: 14

      - name: Deploy over SSH
        if: ${{ env.HAVE_KEY == 'true' }}
        env:
          HAVE_KEY: ${{ secrets.VPS_SSH_KEY != '' }}
          VPS_HOST: ${{ secrets.VPS_HOST }}
        run: echo "configured below"

      - name: Ship to VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "VPS_SSH_KEY not set - built but not deployed."; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes aion.tar.gz "root@$HOST:/tmp/aion.tar.gz"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes deploy/scripts/remote-deploy.sh "root@$HOST:/tmp/remote-deploy.sh"
          $SSH "root@$HOST" 'bash /tmp/remote-deploy.sh /tmp/aion.tar.gz'
