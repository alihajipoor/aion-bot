name: build & deploy

on:
  push:
    branches: [main]
  workflow_dispatch:

concurrency:
  group: deploy
  cancel-in-progress: false

jobs:
  deploy:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      # Node 20 to match the VPS exactly — it has no TS type-stripping,
      # so everything must be compiled here.
      - uses: actions/setup-node@v4
        with:
          node-version: '20'
          cache: npm

      - name: Install
        run: npm ci

      - name: Typecheck & build bot
        run: npm run typecheck

      # The giveaway scoring rules decide who gets a prize, and a prize cannot
      # be taken back. They are pure functions with no database, so there is no
      # excuse for shipping them unproven.
      - name: Test
        run: node --test apps/bot/test/

      - name: Build web panel
        run: npm -w @aion/web run build

      - name: Assemble standalone web bundle
        run: |
          rm -rf webdist && cp -r apps/web/.next/standalone webdist
          mkdir -p webdist/apps/web/.next
          cp -r apps/web/.next/static webdist/apps/web/.next/static
          [ -d apps/web/public ] && cp -r apps/web/public webdist/apps/web/public || true
          du -sh webdist

      # Reinstall without dev dependencies so the shipped bundle stays small.
      # The VPS never runs npm: it has 1.9 GB shared with another bot.
      - name: Prune to production dependencies
        run: npm ci --omit=dev

      - name: Stage the payload
        run: |
          # Collected into one tree so rsync has a single source to compare
          # against the copy already on the VPS.
          rm -rf .payload && mkdir -p .payload
          cp -a node_modules package.json package-lock.json .payload/
          mkdir -p .payload/apps/bot .payload/packages/db
          cp -a apps/bot/dist apps/bot/package.json apps/bot/assets .payload/apps/bot/
          cp -a packages/db/dist packages/db/package.json packages/db/migrations .payload/packages/db/
          cp -a deploy .payload/
          cp -a webdist .payload/
          du -sh .payload

      # The bundle is not uploaded as an artifact. Ship to VPS scps it straight
      # from the workspace in this same job, so nothing ever consumed it — it
      # only spent ~200 MB of account storage per deploy, and eventually filled
      # the quota and failed the whole workflow. The bundle is reproducible
      # from the commit, and the VPS keeps the last three releases anyway.

      - name: Ship to VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "VPS_SSH_KEY not set - built but not deployed."; exit 0; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          SSH="ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20"
          # rsync, not scp.
          #
          # scp re-sent the whole 117 MB bundle every deploy — production
          # node_modules and the web build included — and the runner sits in
          # Azure us-west while the VPS is in Germany. At ~200ms round trip
          # SSH's own channel window throttles a single stream to a couple of
          # megabits, so the upload alone took eight and a half minutes for a
          # change of one file.
          #
          # rsync compares both sides and sends only the difference. The
          # dependencies almost never move, so a normal deploy ships the handful
          # of rebuilt files instead of the entire tree.
          rsync -az --delete --partial \
            -e "ssh -i $HOME/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20" \
            .payload/ "root@$HOST:/opt/aion-staging/"
          scp -i "$HOME/.ssh/id_ed25519" -o BatchMode=yes deploy/scripts/remote-deploy.sh "root@$HOST:/tmp/remote-deploy.sh"
          $SSH "root@$HOST" 'bash /tmp/remote-deploy.sh /opt/aion-staging'
