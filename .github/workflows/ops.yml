name: ops

# Operator tasks that have to run where the database is. The bot's database and
# internal API both bind to 127.0.0.1 on the VPS, so these cannot be done from a
# laptop. Run by hand from the Actions tab or `gh workflow run ops.yml`.
#
# A fixed set of named tasks, not a shell — the point is to make three specific
# operations reachable, not to open a remote terminal.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        required: true
        type: choice
        options:
          - giveaway-review
          - giveaway-refresh
          - giveaway-floors
          - giveaway-joins
          - giveaway-window
          - mafia-games
          - mafia-mvp
          - mafia-swap
          - vps-status
          - giveaway-start
          - giveaway-close
      title:
        description: Giveaway title (start only)
        type: string
        default: "AION Invite Contest"
      days:
        description: Duration in days (start only)
        type: string
        default: "21"
      back:
        description: Hours to reach back (window only)
        type: string
        default: "6"
      event:
        description: Event id (mafia-mvp)
        type: string
        default: ""
      user:
        description: Discord user id (mafia-mvp)
        type: string
        default: ""
      old:
        description: Outgoing player's user id (mafia-swap)
        type: string
        default: ""
      new:
        description: Incoming player's user id (mafia-swap)
        type: string
        default: ""
      floors:
        description: Minimum invites for 1st,2nd,3rd (start and floors)
        type: string
        default: "100,50,30"

concurrency:
  group: deploy          # never runs while a deploy is mid-flight
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run on VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          TASK: ${{ inputs.task }}
          TITLE: ${{ inputs.title }}
          DAYS: ${{ inputs.days }}
          FLOORS: ${{ inputs.floors }}
          BACK: ${{ inputs.back }}
          EVENT: ${{ inputs.event }}
          USERID: ${{ inputs.user }}
          OLDID: ${{ inputs.old }}
          NEWID: ${{ inputs.new }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "VPS_SSH_KEY not set"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 "root@$HOST" \
            "TASK='$TASK' TITLE='$TITLE' DAYS='$DAYS' FLOORS='$FLOORS' BACK='$BACK' EVENT='$EVENT' USERID='$USERID' OLDID='$OLDID' NEWID='$NEWID' bash -s" <<'EOSSH'
          set -euo pipefail
          APP=/opt/aion
          cd "$APP"

          # Hardware, not the bot. Runs plain shell rather than ops.js, so it
          # keeps working when the bundle is the thing that is broken — which is
          # exactly when somebody asks how the machine is doing.
          if [ "$TASK" = "vps-status" ]; then
            echo "===== uptime / load ====="; uptime
            echo; echo "===== cpu ====="
            nproc --all | sed 's/^/cores: /'
            top -bn1 | head -3 | tail -2
            echo; echo "===== memory ====="; free -h
            echo; echo "===== disk ====="; df -h / /opt 2>/dev/null | sort -u
            echo; echo "===== biggest under /opt ====="
            du -xh -d1 /opt 2>/dev/null | sort -h | tail -6
            echo; echo "===== services ====="
            for u in aion-bot aion-web aion-watchdog.timer postgresql; do
              printf '%-22s %s\n' "$u" "$(systemctl is-active "$u" 2>/dev/null || echo '-')"
            done
            echo; echo "===== bot process ====="
            ps -o pid,etime,%cpu,%mem,rss,cmd -C node --sort=-%mem 2>/dev/null | head -5
            echo; echo "===== recent errors ====="
            journalctl -u aion-bot --since '1 hour ago' -p err --no-pager 2>/dev/null | tail -8 || echo "(none)"
            exit 0
          fi

          set -a; . "$APP/.env"; set +a
          sudo -u aionbot \
            --preserve-env=DISCORD_TOKEN,DISCORD_CLIENT_ID,LIVE_GUILD_ID,DATABASE_URL,NODE_ENV,LOG_LEVEL \
            node "$APP/apps/bot/dist/ops.js" "$TASK" \
              --title "$TITLE" --days "$DAYS" --floors "$FLOORS" --back "$BACK" \
              ${EVENT:+--event "$EVENT"} ${USERID:+--user "$USERID"} \
              ${OLDID:+--old "$OLDID"} ${NEWID:+--new "$NEWID"}
          EOSSH
