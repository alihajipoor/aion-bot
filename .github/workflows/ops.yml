name: ops

# Operator tasks that have to run where the database is. The bot's database and
# internal API both bind to 127.0.0.1 on the VPS, so these cannot be done from a
# laptop. Run by hand from the Actions tab or `gh workflow run ops.yml`.
#
# A fixed set of named tasks, not a shell — the point is to make three specific
# operations reachable, not to open a remote terminal.

on:
  workflow_dispatch:
    inputs:
      task:
        description: What to run
        required: true
        type: choice
        options:
          - giveaway-review
          - giveaway-start
          - giveaway-close
      title:
        description: Giveaway title (start only)
        type: string
        default: مسابقه‌ی دعوت آیون
      days:
        description: Duration in days (start only)
        type: string
        default: '21'
      floors:
        description: Minimum invites for 1st,2nd,3rd (start only)
        type: string
        default: 100,100,100

concurrency:
  group: deploy          # never runs while a deploy is mid-flight
  cancel-in-progress: false

jobs:
  run:
    runs-on: ubuntu-latest
    steps:
      - name: Run on VPS
        env:
          KEY: ${{ secrets.VPS_SSH_KEY }}
          HOST: ${{ secrets.VPS_HOST }}
          TASK: ${{ inputs.task }}
          TITLE: ${{ inputs.title }}
          DAYS: ${{ inputs.days }}
          FLOORS: ${{ inputs.floors }}
        run: |
          set -euo pipefail
          if [ -z "$KEY" ]; then echo "VPS_SSH_KEY not set"; exit 1; fi
          mkdir -p ~/.ssh
          printf '%s\n' "$KEY" > ~/.ssh/id_ed25519
          chmod 600 ~/.ssh/id_ed25519
          ssh-keyscan -H "$HOST" >> ~/.ssh/known_hosts 2>/dev/null
          ssh -i ~/.ssh/id_ed25519 -o BatchMode=yes -o ConnectTimeout=20 "root@$HOST" \
            "TASK='$TASK' TITLE='$TITLE' DAYS='$DAYS' FLOORS='$FLOORS' bash -s" <<'EOSSH'
          set -euo pipefail
          APP=/opt/aion/current
          cd "$APP"
          set -a; . "$APP/.env"; set +a
          sudo -u aionbot \
            --preserve-env=DISCORD_TOKEN,DISCORD_CLIENT_ID,LIVE_GUILD_ID,DATABASE_URL,NODE_ENV,LOG_LEVEL \
            node "$APP/apps/bot/dist/ops.js" "$TASK" \
              --title "$TITLE" --days "$DAYS" --floors "$FLOORS"
          EOSSH
